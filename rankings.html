<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网址榜单 | 瞎分享导航</title>
<meta name="description" content="瞎分享导航 - 网址热度日榜/周榜/月榜。">
<link rel="icon" href="assets/img/xfx_favicon.png">
<link rel="apple-touch-icon" href="assets/img/xfx_favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=20260911p">
<script src="assets/js/icon-fallback.js?v=20260911p"></script>
</head>
<body>

<!-- 这是一个简易占位页,对应原网站顶部 Menu/Footer 里的同名链接,内容还没有正式写,
     后面想写正式内容,直接编辑这个文件里 <main> 里的文字即可。
     页头/页脚和首页 index.html 是完全一样的一份 markup(方便复制维护),
     样式也是共用同一份 assets/css/style.css。 -->
<header class="site-header">
  <div class="container header-topbar">

    <!-- 手机端汉堡菜单按钮:放在 logo 前面,最左边(参考老站点布局)。
         桌面端隐藏,展开/收起逻辑+图标切换见 app.js 的 initMobileMenu()。 -->
    <button id="mobile-menu-toggle" class="icon-btn mobile-menu-toggle" aria-label="菜单" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <a href="index.html" class="site-logo">
        <img src="assets/img/xfx_logo.png" class="logo-mark" alt="瞎分享导航">
        <span class="site-logo__title"><span class="logo-accent">瞎分享</span>导航</span>
      </a>

    <nav class="topbar-menu">
      <!-- 瞎分享是主站,放第一位;后面几个链接里"省钱购物""阿杰潮鞋"也是
           站长自己开的其它站点,顺序上跟"瞎分享"挨在一起,再是站内的"网址
           榜单""关于我们"。 -->
      <a href="https://xiafenxiang.com/" target="_blank" rel="noopener">
        <svg class="topbar-menu__icon topbar-menu__icon--purple" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        瞎分享
      </a>
      <a href="rankings.html">
        <svg class="topbar-menu__icon topbar-menu__icon--blue" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        网址榜单
      </a>
      <a href="https://zhegouku.com/" target="_blank" rel="noopener">
        <svg class="topbar-menu__icon topbar-menu__icon--orange" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        省钱购物
      </a>
      <a href="https://ajchaoxie.com/" target="_blank" rel="noopener">
        <svg class="topbar-menu__icon topbar-menu__icon--teal" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18v3H3z"/><path d="M3 17c0-2 1-3 3-4l2-3c1-1 2-2 4-2h2c2 0 3 1 4 3l2 3c1 1 2 2 2 3"/><path d="M9 12v-3"/></svg>
        阿杰潮鞋
      </a>
      <a href="about.html">
        <svg class="topbar-menu__icon topbar-menu__icon--pink" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        关于我们
      </a>
    </nav>

    <span class="topbar-slogan">人生而自由,却往往不在枷锁中。</span>

    <div class="header-actions">
      <button id="search-toggle" class="icon-btn" aria-label="搜索" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="切换深色/浅色模式"></button>
    </div>
  </div>
  <!-- 在占位页上搜索,回车后会自动跳回首页帮你把这次搜索接着做完(见 app.js 里的说明) -->
  <div id="search-panel" class="search-panel">
    <div class="container">
      <form id="search-form" class="search-box" role="search">
        <input id="search-input" type="search" placeholder="搜搜不花钱~" autocomplete="off">
        <select id="search-engine" title="选择搜索方式">
          <option value="site">站内搜索</option>
          <option value="baidu">百度</option>
          <option value="google">Google</option>
          <option value="bing">必应</option>
          <option value="taobao">淘宝</option>
        </select>
        <button type="submit" class="search-submit" aria-label="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
      </form>
    </div>
  </div>
</header>
  <!-- 手机端汉堡菜单展开的抽屉:样式跟首页 .sidebar 分类抽屉完全一样(整屏
       从左边滑出),内容是跟桌面端 .topbar-menu 一样的 5 个链接——这几个
       占位页没有分类,用不上 .sidebar 那一整套,单独给手机端一份。 -->
  <nav id="mobile-nav-panel" class="mobile-nav-panel" aria-label="移动端菜单">
    <div class="mobile-nav-panel__head">网站菜单</div>
    <div class="mobile-nav-panel__links">
    <a href="https://xiafenxiang.com/" target="_blank" rel="noopener"><span class="mobile-link-icon mobile-link-icon--purple"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>瞎分享</a>
    <a href="rankings.html"><span class="mobile-link-icon mobile-link-icon--blue"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>网址榜单</a>
    <a href="https://zhegouku.com/" target="_blank" rel="noopener"><span class="mobile-link-icon mobile-link-icon--orange"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>省钱购物</a>
    <a href="https://ajchaoxie.com/" target="_blank" rel="noopener"><span class="mobile-link-icon mobile-link-icon--teal"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18v3H3z"/><path d="M3 17c0-2 1-3 3-4l2-3c1-1 2-2 4-2h2c2 0 3 1 4 3l2 3c1 1 2 2 2 3"/><path d="M9 12v-3"/></svg></span>阿杰潮鞋</a>
    <a href="about.html"><span class="mobile-link-icon mobile-link-icon--pink"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>关于我们</a>
    </div>
    <button type="button" class="mobile-nav-panel__collapse">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      收起
    </button>
  </nav>


<div id="mobile-menu-backdrop" class="mobile-menu-backdrop"></div>


<main class="rankings-main">
  <!-- 顶部的红色渐变横幅:大标题/副标题的文字由 rankings.js 根据当前
       选中的 tab(日/周/月)动态填入,见下面 id="rankings-hero-title" /
       id="rankings-hero-subtitle" 两个占位。 -->
  <section class="rankings-hero">
    <p class="rankings-hero__label">✦ 网址排行榜 ✦</p>
    <h1 class="rankings-hero__title" id="rankings-hero-title">网址热度日榜</h1>
    <p class="rankings-hero__subtitle" id="rankings-hero-subtitle">根据今天的访问热度排列</p>
  </section>

  <div class="rankings-layout">
    <!-- 左边日榜/周榜/月榜三个 tab,按钮本身由 rankings.js 从
         assets/js/rankings-data.js 里读出来动态生成,这里先留一个空容器。 -->
    <nav class="rankings-tabs" id="rankings-tabs"></nav>

    <!-- 右边榜单列表,同样由 rankings.js 动态渲染,每一项是一张跟首页
         网站卡片同样的 .site-card,只是这里是竖排列表而不是格子。 -->
    <div class="rankings-list" id="rankings-list"></div>
  </div>

  <a class="back-home" href="index.html">← 返回首页</a>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-brand">
      <a href="index.html" class="site-logo">
        <img src="assets/img/xfx_logo.png" class="logo-mark" alt="瞎分享导航">
        <span class="site-logo__title"><span class="logo-accent">瞎分享</span>导航</span>
      </a>
      <p class="footer-slogan">发现实用网站,也欢迎分享你的收藏。</p>
      <div class="footer-social">
        <a class="icon-btn" href="#" title="微信" aria-label="微信" onclick="event.stopPropagation(); document.getElementById('popover-wechat-footer').classList.toggle('is-open'); return false;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </a>
        <!-- 这个气泡是这个 footer 图标专属的(id 带 -footer 后缀,跟右下角
             悬浮按钮那个 #popover-wechat 是两个独立的元素),样式复用同一套
             .fab-popover,但定位改成跟着这里出现(见 style.css .fab-popover--footer),
             不会再跳到屏幕右下角去。 -->
        <div id="popover-wechat-footer" class="fab-popover fab-popover--footer">
          <img src="assets/img/wechat-qr.png" alt="微信二维码">
          <p>扫码加微信</p>
        </div>
        <a class="icon-btn" href="mailto:team.xiafenxiang@gmail.com" title="邮箱" aria-label="邮箱">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
        </a>
        <a class="icon-btn" href="#" title="GitHub" aria-label="GitHub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        </a>
      </div>
    </div>

    <p class="footer-links">
      <a href="https://xiafenxiang.com/" target="_blank" rel="noopener">瞎分享</a>
      <a href="https://zhegouku.com/" target="_blank" rel="noopener">省钱购物</a>
      <a href="https://ajchaoxie.com/" target="_blank" rel="noopener">阿杰潮鞋</a>
      <a href="rankings.html">网址榜单</a>
      <span class="footer-links__break" aria-hidden="true"></span>
      <a href="about.html">关于我们</a>
      <a href="contribute.html">好站投稿</a>
      <a href="links.html">友链申请</a>
      <a href="about.html">免责声明</a>
    </p>

    <div class="footer-qr">
      <figure>
        <img src="assets/img/wechat-qr.png" alt="微信二维码" loading="lazy">
        <figcaption>扫码加微信</figcaption>
      </figure>
      <figure>
        <img src="assets/img/telegram-qr.png" alt="Telegram二维码" loading="lazy">
        <figcaption>扫码加TG</figcaption>
      </figure>
    </div>
  </div>
  <div class="container footer-bottom">
    <p class="footer-copyright">Copyright © <span class="footer-year"></span> <a href="https://xiafenxiang.com/" target="_blank" rel="noopener">瞎分享</a>. All Rights Reserved.</p>
  </div>
</footer>

<div class="fab-stack">
  <div id="popover-tg" class="fab-popover">
    <img src="assets/img/telegram-qr.png" alt="Telegram二维码">
    <p>扫码加TG</p>
  </div>
  <button class="fab" data-popover="popover-tg" aria-label="Telegram联系">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
  </button>

  <div id="popover-wechat" class="fab-popover">
    <img src="assets/img/wechat-qr.png" alt="微信二维码">
    <p>扫码加微信</p>
  </div>
  <button class="fab" data-popover="popover-wechat" aria-label="微信联系">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </button>

  <button class="fab" id="fab-top" aria-label="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>
</div>

<script src="assets/js/data.js?v=20260911p"></script>
